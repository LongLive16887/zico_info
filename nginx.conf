server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    # Astro хэширует имена файлов в /_astro/ — можно кэшировать навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Воркер кэшировать нельзя: браузер должен увидеть новую версию сразу
    # после деплоя, иначе старый кэш будет жить до истечения max-age.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { } default_type "application/javascript; charset=utf-8";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type "application/manifest+json";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
