# www.zico.uz — копия того же сайта: шлём на основной адрес, чтобы у Google была одна версия.
# Хостовый nginx передаёт контейнеру исходный Host, поэтому домены различаются прямо здесь.
server {
    listen 80;
    server_name www.zico.uz;
    return 301 https://zico.uz$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Переадресации (например, /ru → /ru/) — относительные: абсолютные получались с http://
    # и внутренним адресом контейнера, лишний шаг через http снаружи.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    gzip_min_length 512;

    # Несуществующий адрес — настоящая 404, а не главная с кодом 200.
    error_page 404 /404.html;

    # Astro хэширует имена файлов в /_astro/ — можно кэшировать навсегда.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Воркер кэшировать нельзя: браузер должен увидеть новую версию сразу
    # после деплоя, иначе старый кэш будет жить до истечения max-age.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { } default_type "application/javascript; charset=utf-8";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { } default_type "application/manifest+json";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
}
