# Деплой на VPS: GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    ports:
      - '127.0.0.1:3010:80'
